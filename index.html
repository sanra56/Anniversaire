<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pour mon ptit Coeur ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- COEURS EN ARRIÈRE-PLAN -->

    <div class="background-hearts">
        <span>♡</span>
        <span>♡</span>
        <span>♡</span>
        <span>♡</span>
        <span>♡</span>
        <span>♡</span>
    </div>


    <!-- =========================
         ACCUEIL
    ========================== -->

    <main class="welcome" id="welcome">

        <div class="small-heart">♥</div>

        <h1>
            Pour mon <span>ptit Coeur</span> ❤️
        </h1>

        <p>
            J’espère que ça va te plaire,<br>
            j’ai préparé tout ça rien que pour toi... 🥰
        </p>

        <button id="openButton">
            Découvrir 🍒
        </button>

    </main>


    <!-- =========================
         PAGE DE LA LETTRE
    ========================== -->

    <main class="letter-page hidden" id="letterPage">

        <div class="paper" id="paper">

            <div class="paper-content">

                <h2>Pour Clara ❤️</h2>

                <div id="letterText"></div>

            </div>

        </div>


        <!-- STYLO -->

        <button class="pen-button hidden" id="penButton">
            🖊️
        </button>


        <p class="click-text" id="clickText">
            Clique sur la lettre 💌
        </p>

    </main>


    <script src="script.js"></script>

</body>

</html>


    <script src="script.js"></script>

</body>

</html>
