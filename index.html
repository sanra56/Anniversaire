<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pour mon ptit Coeur ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- PETITS COEURS EN ARRIÈRE-PLAN -->
    <div class="background-hearts">
        <span>♡</span>
        <span>♡</span>
        <span>♡</span>
        <span>♡</span>
        <span>♡</span>
        <span>♡</span>
    </div>


    <!-- PAGE D'ACCUEIL -->
    <main class="welcome" id="welcome">

        <div class="small-heart">♥</div>

        <h1>
            Pour mon <span>ptit Coeur</span> ❤️
        </h1>

        <p>
            J’espère que ça va te plaire,<br>
            j’ai préparé tout ça rien que pour toi... 🥰
        </p>

        <button id="openButton">
            Découvrir 🍒
        </button>

    </main>


    <!-- PAGE DE L'ENVELOPPE -->
    <main class="letter-page hidden" id="letterPage">

        <p class="little-text">
            Une petite chose pour commencer...
        </p>

        <div class="envelope-container" id="envelope">

            <div class="envelope">

                <div class="envelope-back"></div>

                <div class="letter">
                    <h2>Pour Clara ❤️</h2>

                    <p>
                        J’espère que cette petite surprise
                        te fera sourire.
                    </p>

                    <p>
                        Et surtout... ce n'est que le début. ✨
                    </p>
                </div>

                <div class="envelope-front"></div>

                <div class="envelope-flap"></div>

            </div>

        </div>

        <p class="click-text">
            Clique sur l'enveloppe 💌
        </p>

    </main>


    <script src="script.js"></script>

</body>

</html>
